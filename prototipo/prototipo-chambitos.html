<title>Chambitos Prototipo v1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* layout: lienzo neutro con un móvil Android centrado y una columna de notas; colores sacados de autobuseschambitos.com */
:root{
  --bg:#efebe9; --fg:#1e1810; --muted:#575250; --line:#ddd5d2;
  --phone:#ffffff; --surface:#f8f5f4; --brand:#a80607; --brand-fg:#ffffff; --brand-dark:#1e1810;
  --accent:#ff5100; --accent-fg:#ffffff; --ok:#1d7a46; --bad:#a80607; --seat:#ebe5e3; --seat-taken:#8a8381;
  --display:"Archivo",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141110; --fg:#f2ece9; --muted:#b0a7a3; --line:#3a3330;
  --phone:#1e1a18; --surface:#28221f; --brand:#a80607; --brand-fg:#ffffff; --brand-dark:#0e0b0a;
  --accent:#ff7a3d; --accent-fg:#1e1810; --ok:#5cc98a; --bad:#ff8a80; --seat:#3a3330; --seat-taken:#6b6360; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141110; --fg:#f2ece9; --muted:#b0a7a3; --line:#3a3330;
  --phone:#1e1a18; --surface:#28221f; --brand:#a80607; --brand-fg:#ffffff; --brand-dark:#0e0b0a;
  --accent:#ff7a3d; --accent-fg:#1e1810; --ok:#5cc98a; --bad:#ff8a80; --seat:#3a3330; --seat-taken:#6b6360; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:980px;margin:0 auto;display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.notes{flex:1 1 300px;min-width:0;max-width:420px}
.notes h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 6px;text-wrap:balance}
.notes p{color:var(--muted);line-height:1.55;margin:0 0 12px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.jump button{font:500 13px var(--body);border:1px solid var(--line);background:var(--phone);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer}
.jump button[aria-current="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.rf{font:500 12px var(--mono);color:var(--brand)}
.phone{flex:0 0 auto;width:360px;max-width:100%;height:720px;border-radius:34px;border:10px solid #1e1810;background:var(--phone);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:24px;display:flex;justify-content:space-between;padding:0 18px;font:500 12px var(--body);align-items:center;color:#fff;background:var(--brand-dark)}
.bar{background:var(--brand);color:var(--brand-fg);padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:58px}
.bar img{height:34px;width:auto}
.bar h2{margin:0;font:700 16px var(--display);flex:1;text-align:right}
.bar button{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;padding:0 4px}
.screen{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--phone)}
.nav button{flex:1;background:none;border:0;padding:10px 0 12px;font:500 11px var(--body);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:18px}
.nav button.on{color:var(--brand);font-weight:600}
label{font:500 12px var(--body);color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:400 15px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.btn{font:600 15px var(--body);padding:13px;border-radius:8px;border:0;background:var(--brand);color:var(--brand-fg);cursor:pointer;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.btn.alt{background:var(--brand-dark);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.jump button:focus-visible,.nav button:focus-visible,.trip:focus-visible,.seat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{background:var(--brand);margin:-16px -16px 4px;padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero img{width:220px;height:auto}
.hero span{color:#fff;font-size:13px;opacity:.85}
.sub{color:var(--muted);margin:0;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px;border:0;background:var(--surface);color:var(--fg);font:500 13px var(--body);cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-fg)}
.trip{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer;background:var(--phone);text-align:left;color:var(--fg);font:inherit}
.trip .t{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.trip .p{font:700 17px var(--display);color:var(--brand);text-align:right}
.trip .m{color:var(--muted);font-size:13px}
.pill{font:600 11px var(--body);padding:3px 8px;border-radius:99px;justify-self:end;background:var(--seat);color:var(--fg)}
.pill.low{background:var(--accent);color:var(--accent-fg)}
.pill.ok{background:var(--ok);color:var(--phone)}
.pill.bad{background:var(--bad);color:var(--phone)}
.pill.line{background:var(--brand-dark);color:#fff;font-family:var(--mono)}
.head{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 0}
.bus{border:2px solid var(--line);border-radius:22px 22px 10px 10px;padding:14px 12px;display:grid;grid-template-columns:repeat(2,1fr) 18px repeat(2,1fr);gap:7px;align-self:center;width:200px}
.bus .front{grid-column:1/-1;font:500 11px var(--mono);color:var(--muted);text-align:center;margin-bottom:4px}
.seat{aspect-ratio:1;max-width:100%;border-radius:6px;border:0;background:var(--seat);color:var(--fg);font:500 11px var(--mono);cursor:pointer}
.seat.taken{background:var(--seat-taken);color:var(--phone);cursor:not-allowed}
.seat.sel{background:var(--brand);color:#fff}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.ticket{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ticket .top{background:var(--brand);color:var(--brand-fg);padding:14px}
.ticket .top b{font:800 20px var(--display);display:block}
.ticket dl{margin:0;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.ticket dt{color:var(--muted)} .ticket dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.code{font:500 13px var(--mono);text-align:center;padding:10px;border-top:1px dashed var(--line);color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.stops{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--brand)}
.stops li{position:relative;padding:5px 0 5px 10px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.stops li::before{content:"";position:absolute;left:-21px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--phone);border:3px solid var(--brand)}
.stops li span:last-child{font-family:var(--mono);color:var(--muted);font-size:12px;text-align:right}
.toast{position:absolute;left:16px;right:16px;bottom:74px;background:var(--fg);color:var(--phone);padding:11px 14px;border-radius:8px;font-size:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card summary::-webkit-details-marker{display:none}
.tag{font:600 11px var(--body);background:var(--accent);color:var(--accent-fg);border-radius:4px;padding:2px 6px;align-self:flex-start}
.map{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.map svg{display:block;width:100%;height:auto}
.confirm{display:flex;gap:8px}
.confirm .btn{flex:1}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:14px;text-align:center}
.enter{animation:entra .32s cubic-bezier(.2,.8,.2,1)}
.enter.back{animation-name:vuelve}
@keyframes entra{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes vuelve{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.btn,.trip,.seat{transition:transform .12s,box-shadow .2s}
.btn:active:not(:disabled),.trip:active:not(:disabled){transform:scale(.97)}
.trip:hover:not(:disabled){box-shadow:0 4px 14px rgba(30,24,16,.12)}
.stagger>*{animation:sube .4s both cubic-bezier(.2,.8,.2,1)}
.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.14s}.stagger>*:nth-child(4){animation-delay:.21s}.stagger>*:nth-child(5){animation-delay:.28s}.stagger>*:nth-child(6){animation-delay:.35s}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.skel{height:78px;border-radius:10px;background:linear-gradient(90deg,var(--seat) 0%,var(--surface) 50%,var(--seat) 100%);background-size:200% 100%;animation:brillo 1s linear infinite}
@keyframes brillo{from{background-position:200% 0}to{background-position:0 0}}
.seat.sel{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.check{width:64px;height:64px;align-self:center}
.check circle{stroke-dasharray:190;stroke-dashoffset:190;animation:dibuja .5s .1s forwards}
.check path{stroke-dasharray:50;stroke-dashoffset:50;animation:dibuja .35s .55s forwards}
@keyframes dibuja{to{stroke-dashoffset:0}}
.ticket{animation:sube .45s .4s both}
.splash{flex:1;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden;position:relative}
.splash img{width:230px;height:auto;animation:sube .6s .2s both}
.splash .road{position:absolute;bottom:120px;left:0;right:0;height:2px;background:rgba(255,255,255,.35)}
.splash .busico{position:absolute;bottom:122px;left:-90px;animation:conduce 1.9s .3s cubic-bezier(.5,0,.3,1) forwards}
@keyframes conduce{to{left:110%}}
.splash small{position:absolute;bottom:60px;color:#fff;opacity:.8;font-size:13px}
.err{color:var(--bad);font-size:12px;margin-top:-6px}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.chk input{width:18px;height:18px;padding:0}
.fuerza{height:5px;border-radius:3px;background:var(--seat);overflow:hidden;margin-top:-6px}
.fuerza i{display:block;height:100%;transition:width .3s,background .3s}
.shake{animation:tiembla .35s}
@keyframes tiembla{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.favs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.chip b{color:var(--brand)}
.star{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:0 2px;line-height:1}
.star.on{color:#ffd54a;animation:pop .3s}
.prox{background:var(--brand-dark);color:#fff;border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.prox small{opacity:.75;font-size:12px;grid-column:1/-1}
.prox b{font:700 17px var(--display)}
.prox .cd{font:700 26px var(--mono);grid-row:2/4;grid-column:2;font-variant-numeric:tabular-nums}
.prox span{opacity:.85;font-size:13px}
.near{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.near button{margin-left:auto;padding:7px 10px;font-size:12px}
.qr{align-self:center;background:#fff;padding:10px;border-radius:8px;margin:4px auto 10px;width:max-content}
.qr img,.qr canvas{display:block;width:130px;height:130px}
.noti{position:absolute;left:10px;right:10px;top:30px;background:var(--phone);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;z-index:5;animation:baja 4.2s forwards}
.noti .ico{width:34px;height:34px;border-radius:8px;background:var(--brand);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.noti .ico img{width:30px}
.noti p{margin:0;font-size:13px;line-height:1.35}
@keyframes baja{0%{transform:translateY(-120%)}10%,85%{transform:none}100%{transform:translateY(-140%)}}
.screen>*{flex-shrink:0}
.sw{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg);cursor:pointer}
.sw input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--seat-taken);position:relative;cursor:pointer;padding:0;border:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{left:16px}
.mapa2{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);position:relative}
.mapa2 svg{display:block;width:100%;height:auto}
.mapa2 .ruta{stroke-dasharray:6 6;animation:anda 1s linear infinite}
@keyframes anda{to{stroke-dashoffset:-12}}
.mapa2 .yo{animation:pulso 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulso{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.mapa2 .esc{position:absolute;right:8px;bottom:6px;font:500 10px var(--mono);color:var(--muted);background:var(--phone);padding:2px 5px;border-radius:4px}
.datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.datos div{background:var(--surface);border-radius:8px;padding:8px 4px}
.datos b{display:block;font:700 18px var(--display);color:var(--brand)}
.datos span{font-size:11px;color:var(--muted)}
.gmaps{display:block;text-align:center;text-decoration:none}
.offbar{background:#5a5654;color:#fff;font:500 12px var(--body);text-align:center;padding:5px}
.swap{align-self:flex-end;margin:-6px 0 -6px;border:1px solid var(--line);background:var(--phone);color:var(--brand);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;transition:transform .3s}
.swap:active{transform:rotate(180deg)}
.cnt{display:flex;align-items:center;gap:12px;justify-content:center}
.cnt button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer}
.cnt b{font:700 20px var(--display);min-width:24px;text-align:center}
.estado{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 10px;color:var(--muted)}
.estado svg{width:90px;height:90px}
.estado b{color:var(--fg);font:700 17px var(--display)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;font:800 30px var(--display);display:flex;align-items:center;justify-content:center;align-self:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.stats b{display:block;font:700 20px var(--display)}
.stats span{font-size:11px;color:var(--muted)}
.occ{display:grid;grid-template-columns:34px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.occ .tr{height:14px;background:var(--seat);border-radius:7px;overflow:hidden}
.occ .tr i{display:block;height:100%;border-radius:7px;animation:crece .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes crece{from{width:0!important}}
.occ span:last-child{font-family:var(--mono);text-align:right}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:var(--surface);border-radius:8px;padding:10px}
.kpi b{display:block;font:700 22px var(--display);color:var(--brand)}
.kpi span{font-size:12px;color:var(--muted)}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}
.arow .n{font-weight:600;font-size:14px}
.arow .d{color:var(--muted);font-size:12px}
.acts{display:flex;gap:4px;flex-shrink:0}
.ib{border:1px solid var(--line);background:var(--phone);color:var(--fg);border-radius:6px;padding:6px 8px;font:500 12px var(--body);cursor:pointer}
.ib.del{color:var(--bad);border-color:var(--bad)}
.aviso{background:var(--surface);border:1px solid var(--bad);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:8px;margin:6px 0}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chks label{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.chks input{width:16px;height:16px;padding:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r2 label{min-width:0}.r2 input,.r2 select{min-width:0;width:100%}
.hor{overflow-x:auto;border:1px solid var(--line);border-radius:10px;flex-shrink:0}
.hor table{border-collapse:collapse;font-size:13px;width:100%}
.hor th,.hor td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.hor tbody tr:nth-child(even){background:var(--surface)}
.hor thead th{background:var(--brand);color:#fff;font-weight:600;position:sticky;top:0}
.hor thead th:first-child,.hor tbody th{position:sticky;left:0;text-align:left;z-index:1}
.hor tbody th{background:var(--phone);font-weight:600;border-right:1px solid var(--line)}
.hor tbody tr:nth-child(even) th{background:var(--surface)}
.hor thead th:first-child{background:var(--brand)}
.hor td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hor td.ext{font-weight:700;color:var(--brand)}
.hor .no{color:var(--seat-taken)}
.hor .pill.line{background:#fff;color:var(--brand)}
.lerr{color:var(--bad);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>4G ▮▮▮ 82%</span></div>
    <div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  </div>
  <div class="notes">
    <h1>Chambitos, prototipo 7</h1>
    <p>Colores y logo de la web de Autobuses Chambitos. Las líneas, paradas y horas son las del PDF de horarios de su web (Línea 1 y Línea 2). Los precios y las plazas ocupadas son de ejemplo porque la web no los publica.</p>
    <div class="jump" id="jump"></div>
    <p id="note"></p>
    <label style="flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg)"><input type="checkbox" id="offline" onchange="S.offline=this.checked;anterior=S.pantalla;pintar(true)" style="width:18px;height:18px;padding:0">Simular que el móvil no tiene conexión</label>
  </div>

function elegir(n){if(S.plazas.includes(n))S.plazas=S.plazas.filter(x=>x!==n);else{S.plazas.push(n);if(S.plazas.length>S.nv)S.plazas.shift()}anterior="plaza";pintar(true)}
function viajeros(d,max){const n=S.nv+d;if(n<1||n>4||(max&&n>max)){if(n>4)toast("Máximo 4 viajeros por reserva");return}S.nv=n;while(S.plazas.length>n)S.plazas.pop();anterior="plaza";pintar(true)}
const total=(p,n)=>(parseFloat(p.replace(",","."))*n).toFixed(2).replace(".",",");
function errorRed(t,d,acc){return `<div class="estado"><svg viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="42" fill="var(--surface)"/><path d="M22 40a32 32 0 0146 0M30 49a20 20 0 0130 0M38 58a8 8 0 0114 0" fill="none" stroke="var(--seat-taken)" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="66" r="4" fill="var(--seat-taken)"/><path d="M24 24l42 42" stroke="var(--bad)" stroke-width="5" stroke-linecap="round"/></svg><b>${t}</b><span>${d}</span><button class="btn" style="align-self:stretch" onclick="${acc}">Reintentar</button></div>`}
function reservar(){if(S.offline){toast("No hay conexión. La reserva no se ha hecho, inténtalo otra vez.");return}
 const {id,i,j}=S.viaje;const v=viajes.find(x=>x.id===id);v.libres-=S.nv;S.ocupadas.splice(v.total-v.libres-S.nv,0,...S.plazas);S.plaza=S.plazas.join(", ");
 const f=S.fecha.split("-").reverse().join("/");
 S.reservas.unshift({id:"CH-"+(20500+S.reservas.length),ruta:v.p[i][0]+" → "+v.p[j][0],fecha:f,hora:v.p[i][1],linea:v.linea,precio:total(pv(v,i,j),S.nv),plaza:S.plaza,n:S.nv,estado:"Confirmada"});ir("ok")}
function cancelar(i){S.reservas[i].estado="Cancelada";S.reservas[i].preg=false;const r=S.reservas[i];toast("Reserva cancelada. "+((r.n||1)>1?"Las plazas "+r.plaza+" vuelven":"La plaza "+r.plaza+" vuelve")+" a estar libre"+((r.n||1)>1?"s":""))}

function pintar(sinAnim){
 if(S.pantalla==="form"&&!S.form)S.form={tipo:"bus",k:-1,d:{mat:"",plazas:"40"},e:{}};
 if(["admin","pasajeros","form"].includes(S.pantalla))S.rol="admin";else if(S.pantalla!=="login")S.rol="viajero";
 if(S.pantalla==="plaza"&&!S.viaje){const r=buscar()[0];S.viaje=r?{id:r.v.id,i:r.i,j:r.j}:{id:1,i:0,j:5}}
 if(S.pantalla==="pasajeros"&&!S.viaje)S.viaje={id:1,i:0,j:7};
 if(S.pantalla==="ok"&&!S.reservas[0].linea){S.viaje=S.viaje||{id:1,i:1,j:7};S.plaza=S.plaza||44;}
 document.getElementById("app").innerHTML=(S.offline&&!["splash","login","registro"].includes(S.pantalla)?'<div class="offbar">Sin conexión · algunas funciones no van</div>':"")+vistas[S.pantalla]()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
 const sc=document.querySelector("#app .screen, #app .splash");if(sc&&!sinAnim&&anterior!==S.pantalla){sc.classList.add("enter");if(S.atras)sc.classList.add("back")}anterior=S.pantalla;pintarQR();
 document.getElementById("jump").innerHTML=Object.entries(pantallas).map(([k,[n]])=>`<button aria-current="${k===S.pantalla}" onclick="ir('${k}')">${n}</button>`).join("");
 document.getElementById("note").innerHTML=`<span class="rf">${pantallas[S.pantalla][1]}</span><br>${notas[S.pantalla]}`;
}
S.reservas[0].linea="1a";S.reservas[0].precio="2,95";
ir("splash");
</script>
